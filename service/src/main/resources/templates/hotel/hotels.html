<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/bootstrap.min.js"></script>
    <title>Hotels</title>
</head>
<body>
<div th:insert="~{fragment :: header}"></div>
<div class="container py-5">
    <div class="row text-center mb-5">
        <div class="col-lg-7 mx-auto">
            <h1 class="display-4">Hotels List</h1>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <ul class="list-group shadow" th:each="hotel : ${hotels.content}">
                <li class="list-group-item">
                    <div class="d-flex align-items-center">
                        <div th:if="${hotel.photo}" class="mr-3 p-3">
                            <img class="img-thumbnail square-img"
                                 th:src="@{/api/v1/hotels/{hotelId}/avatar(hotelId=${hotel.id})}"
                                 alt="User photo" width="100" height="100"></div>
                        <div class="media-body">
                            <p class="mt-0 font-weight-bold mb-2" th:text="'Name: ' + ${hotel.name}">Name:</p>
                            <form th:action="@{/hotels/{hotelId}/delete(hotelId=${hotel.id})}" method="post">
                                <a th:href="@{'/hotels/' + ${hotel.id}}">
                                    <button type="button" class="btn btn-info">edit</button>
                                </a>
                                <button type="submit" class="btn btn-danger">delete</button>
                            </form>
                        </div>
                    </div>
                </li>
            </ul>
            <div class="list-group-item">
                <a href="/hotels/save-hotel">
                    <button type="button" class="btn btn-info mt-3 w-100">Create a new hotel</button>
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
