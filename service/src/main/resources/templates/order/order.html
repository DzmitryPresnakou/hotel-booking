<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/bootstrap.min.js"></script>
    <title>Order</title>
</head>
<body>
<div th:insert="~{fragment :: header}"></div>

<div class="container py-5">
    <div class="row text-center mb-5">
        <div class="col-lg-7 mx-auto">
            <h1 class="display-4">Order</h1>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="col-xl-4 col-md-6 col-sm-12 mb-3 shadow">
                <div class="card-body">
                    <form class="mb-4" th:action="@{/orders/{orderId}/update(orderId=${order.id})}"
                          enctype="multipart/form-data"
                          method="post"
                          th:object="${order}">

                        <input id="room" type="hidden" class="form-control" name="room"
                               th:value="${order.room}">
                        <input id="username" type="hidden" class="form-control" name="username"
                               th:value="${order.user}">
                        <input id="status" type="hidden" class="form-control" name="status"
                               th:value="${order.status}">
                        <input id="paymentStatus" type="hidden" class="form-control" name="paymentStatus"
                               th:value="${order.paymentStatus}">
                        <input id="checkInDate" type="hidden" class="form-control" name="checkInDate"
                               th:value="${order.checkInDate}">
                        <input id="checkOutDate" type="hidden" class="form-control" name="checkOutDate"
                               th:value="${order.checkOutDate}">

                        <div class="d-flex align-items-center">
                            <div class="media-body">
                                <p class="mt-0 font-weight-bold mb-2" th:text="'Username: ' + ${order.user.username}">
                                    Username:</p>
                                <p class="mt-0 font-weight-bold mb-2" th:text="'Hotel: ' + ${order.room.hotel.name}">
                                    Hotel:</p>
                                <p class="mt-0 font-weight-bold mb-2" th:text="'Occupancy: ' + ${order.room.occupancy}">
                                    Hotel:</p>
                                <p class="mt-0 font-weight-bold mb-2"
                                   th:text="'Price per day: ' + ${order.room.pricePerDay} + '$'">Price per day:</p>
                                <p class="mt-0 font-weight-bold mb-2"
                                   th:text="'Check In Date: ' + ${order.checkInDate}">
                                    Check In Date:</p>
                                <p class="mt-0 font-weight-bold mb-2"
                                   th:text="'Check Out Date: ' + ${order.checkOutDate}">
                                    Check Out Date:</p>
                                <p class="mt-0 font-weight-bold mb-2" th:text="'Status: ' + ${order.status}">Status:</p>
                                <p class="mt-0 font-weight-bold mb-2"
                                   th:text="'Payment Status: ' + ${order.paymentStatus}">
                                    Payment Status:</p>
                                <form th:action="@{/orders/{orderId}/delete(orderId=${order.id})}" method="post">
                                    <a th:href="@{'/orders/' + ${order.id}}">
                                        <button type="button" class="btn btn-info">edit</button>
                                    </a>
                                    <button type="submit" class="btn btn-danger">delete</button>
                                </form>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="submit" class="btn btn-outline-info btn-primary"
                                    th:if="${#authentication.principal.authorities[0].authority == 'ADMIN'}">
                                Update
                            </button>
                            <form th:action="@{/orders/{orderId}/delete(orderId=${order.id})}"
                                  th:if="${#authentication.principal.authorities[0].authority == 'ADMIN'}"
                                  method="post">
                                <button type="submit" class="btn btn-danger btn-primary">
                                    Remove
                                </button>
                            </form>
                        </div>
                    </form>
                    <div th:if="${errors}">
                        <p class="text-danger" th:each="error : ${errors}" th:text="${error.defaultMessage}">Error message</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
