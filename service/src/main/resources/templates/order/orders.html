<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <script src="/js/bootstrap.min.js"></script>
    <title>Orders</title>
</head>
<body>
<div th:insert="~{fragment :: header}"></div>
<div class="container py-5">
    <div class="row text-center mb-5">
        <div class="col-lg-7 mx-auto">
            <h1 class="display-4">Orders List</h1>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <form class="mb-4" action="/orders">
                <div>
                    <label for="hotel" class="form-label">Hotel:
                        <select class="form-select" id="hotel" name="hotelName">
                            <option th:each="hotel : ${hotels}"
                                    th:value="${hotel.name}"
                                    th:selected="${hotel.name == filter.hotelName}"
                                    th:text="${hotel.name}">Hotel
                            </option>
                        </select>
                    </label>
                </div>
                <div>
                    <label for="username" class="form-label">Username:
                        <select class="form-select" id="username" name="username">
                            <option th:each="user : ${users}"
                                    th:value="${user.username}"
                                    th:selected="${user.username == filter.username}"
                                    th:text="${user.username}">User
                            </option>
                        </select>
                    </label>
                </div>
                <div>
                    <label for="checkInDate" class="form-label">Check In Date:
                        <input id="checkInDate" type="date" class="form-control" name="checkInDate"
                               th:value="${filter.checkInDate}">
                    </label>
                </div>
                <div>
                    <label for="checkOutDate" class="form-label">Check Out Date:
                        <input id="checkOutDate" type="date" class="form-control" name="checkOutDate"
                               th:value="${filter.checkOutDate}">
                    </label>
                </div>
                <div>
                    <label for="page" class="form-label">Page:
                        <input id="page" type="number" class="form-control" name="page"
                               th:value="${orders.metadata.page}">
                    </label>
                    <label for="size" class="form-label">Size:
                        <input id="size" type="number" class="form-control" name="size"
                               th:value="${orders.metadata.size}">
                    </label>
                </div>
                <button type="submit" class="btn btn-outline-info">Filter</button>
            </form>
            <ul class="list-group shadow" th:each="order : ${orders.content}">
                <li class="list-group-item">
                    <div class="d-flex align-items-center">
                        <div class="media-body">
                            <p class="mt-0 font-weight-bold mb-2" th:text="'Username: ' + ${order.user.username}">
                                Username:</p>
                            <p class="mt-0 font-weight-bold mb-2" th:text="'Hotel: ' + ${order.room.hotel.name}">Hotel:</p>
                            <p class="mt-0 font-weight-bold mb-2" th:text="'Occupancy: ' + ${order.room.occupancy}">Hotel:</p>
                            <p class="mt-0 font-weight-bold mb-2"
                               th:text="'Price per day: ' + ${order.room.pricePerDay} + '$'">Price per day:</p>
                            <p class="mt-0 font-weight-bold mb-2" th:text="'Check In Date: ' + ${order.checkInDate}">
                                Check In Date:</p>
                            <p class="mt-0 font-weight-bold mb-2" th:text="'Check Out Date: ' + ${order.checkOutDate}">
                                Check Out Date:</p>
                            <p class="mt-0 font-weight-bold mb-2" th:text="'Status: ' + ${order.status}">Status:</p>
                            <p class="mt-0 font-weight-bold mb-2" th:text="'Payment Status: ' + ${order.paymentStatus}">
                                Payment Status:</p>
                            <form th:action="@{/orders/{orderId}/delete(orderId=${order.id})}" method="post">
                                <a th:href="@{'/orders/' + ${order.id}}">
                                    <button type="button" class="btn btn-info">edit</button>
                                </a>
                                <button type="submit" class="btn btn-danger">delete</button>
                            </form>
                        </div>
                    </div>
                </li>
            </ul>
            <!--            <div class="list-group-item">-->
            <!--                <a href="/orders/save-order">-->
            <!--                    <button type="button" class="btn btn-info">Create a new order</button>-->
            <!--                </a>-->
            <!--            </div>-->
        </div>
    </div>
</div>
</body>
</html>
